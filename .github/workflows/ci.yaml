name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node Js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run prisma generate
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node Js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Prisma generate
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

  e2e:
    services:
      postgres:
        image: postgres:18.1
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_123
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.4
        ports:
          - 6379:6379

      clamd:
        image: clamav/clamav:1.5-debian
        ports:
          - 3310:3310
        env:
          CLAMD_CONF_MaxFileSize: 0
          CLAMD_CONF_StreamMaxLength: 0
        options: >-
          --health-cmd clamdcheck.sh
          --health-interval 30s
          --health-timeout 25s
          --health-retries 5
          --health-start-period 120s

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node Js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgres://postgres:postgres_123@localhost:5432/postgres

      - name: Run prisma generate
        run: npx prisma generate

      - name: Load test environment
        run: cat .env.test >> $GITHUB_ENV

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres_123@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [unit, lint, e2e]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.unit.result != 'failure' && needs.lint.result != 'failure' && needs.e2e.result != 'failure' && 'success' || 'failure' }}
          title: 'CI Pipeline'
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
