name: Deploy
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'ops/**'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build Docker Image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: false
          pull: true
          load: true # after buildin the image, add it to the imagge stor
          tags: ${{ vars.DOCKER_USERNAME }}/temp:latest, ${{ vars.DOCKER_USERNAME }}/temp:${{ github.sha }}

      - name: Image Scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: 1
          severity: 'CRITICAL,HIGH'
          image-ref: ${{ vars.DOCKER_USERNAME }}/temp:${{ github.sha }}
          scan-type: 'image'
          ignore-unfixed: true
          format: table

      - name: Push Docker Image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/temp:${{ github.sha }}
          docker push ${{ vars.DOCKER_USERNAME }}/temp:latest

  migrate:
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest

      - name: Run Database Migrations
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          CURRENT_SHA: ${{ github.sha }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.HOSTNAME }} \
            "DOCKER_USERNAME='$DOCKER_USERNAME' CURRENT_SHA='$CURRENT_SHA' REMOTE_USER='$REMOTE_USER' DOPPLER_TOKEN='$DOPPLER_TOKEN' bash -s" < ./scripts/migrate.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest

      - name: Backup current deployment on VPS
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.HOSTNAME }} \
            "REMOTE_USER='$REMOTE_USER' bash -s" < ./scripts/backup-ops.sh

      - name: Copy files to VPS
        run: |
          rsync -avr --exclude=".git/*" --exclude=".env*" --exclude="backup/" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ops/ ${{ secrets.REMOTE_USER }}@${{ secrets.HOSTNAME }}:/home/${{ secrets.REMOTE_USER }}/projects/temp/

      - name: Start containers and rollback on failure
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          CURRENT_SHA: ${{ github.sha }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.HOSTNAME }} \
            "REMOTE_USER='$REMOTE_USER' CURRENT_SHA='$CURRENT_SHA' DOCKER_USERNAME='$DOCKER_USERNAME' DOPPLER_TOKEN='$DOPPLER_TOKEN' bash -s" < ./scripts/start-or-rollback.sh

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build, migrate, deploy]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.build.result == 'success' && needs.migrate.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
          title: 'Production Deployment'
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
