services:
  postgres:
    container_name: temp_postgres
    image: postgres:18.1
    cpus: 1
    mem_limit: 2g
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: loki
      options:
        loki-url: 'http://loki:3100/loki/api/v1/push'
        loki-external-labels: 'container={{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m
        loki-pipeline-stages: |
          - regex:
              expression: '(?i)\[?\d+\]?\s+(?P<level>LOG|INFO|WARNING|ERROR|FATAL|PANIC|DEBUG):'
          - template:
              source: level
              template: '{{ ToLower .Value }}'
          - labels:
              level:
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_18_data_temp:/var/lib/postgresql
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./init-exporter.sh:/docker-entrypoint-initdb.d/init-exporter.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_EXPORTER_PASSWORD=${POSTGRES_EXPORTER_PASSWORD}
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - system_wide_network

  redis:
    container_name: temp_redis
    image: redis:8.4
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: loki
      options:
        loki-url: 'http://loki:3100/loki/api/v1/push'
        loki-external-labels: 'container={{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data_temp:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - system_wide_network
  temp:
    image: 545plea/temp:latest
    container_name: temp
    cpus: 0.5
    mem_limit: 512m
    cap_drop:
      - ALL
    logging:
      driver: loki
      options:
        loki-url: 'http://loki:3100/loki/api/v1/push'
        loki-external-labels: 'container={{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level_label
                timestamp: timestamp
                message: message
                environment: environment
                service: service
          - labels:
              level:
              service:
              environment:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.000Z"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - system_wide_network

  clamd:
    container_name: clamd
    image: clamav/clamav:1.5-debian
    cpus: 2
    mem_limit: 2g
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: loki
      options:
        loki-url: 'http://loki:3100/loki/api/v1/push'
        loki-external-labels: 'container={{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m
    security_opt:
      - no-new-privileges:true
    environment:
      - CLAMD_CONF_MaxFileSize=0
      - CLAMD_CONF_StreamMaxLength=0
      - FRESHCLAM_CONF_Checks=1
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 100s
    restart: unless-stopped
    networks:
      - system_wide_network

volumes:
  postgres_18_data_temp:
  redis_data_temp:
  clamav_data:

networks:
  system_wide_network:
    external: true
    name: system_wide_network
